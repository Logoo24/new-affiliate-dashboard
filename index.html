<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Financialize Partner Portal</title>
<!--
  The base URL lands on the Partnership summary. This stub only forwards —
  the Performance overview (Module A) now lives at performance.html.

  The redirect is a script, not a <meta refresh>, because filter and partner
  state live in the query string and a meta refresh to a fixed URL would drop
  it. In the PHP build this file does not exist at all: "/" is just routed to
  the partnership summary server-side.
-->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<script>
  location.replace('partnership.html' + location.search + location.hash);
</script>
<noscript>
  <meta http-equiv="refresh" content="0; url=partnership.html">
</noscript>
</head>
<body>
<p><a href="partnership.html">Continue to the Partnership summary</a></p>
</body>
</html>
