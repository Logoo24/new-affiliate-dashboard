<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead table — Financialize Partner Portal</title>
<link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

<div class="app">
  <aside class="sidebar" data-shell="sidebar"></aside>

  <div class="main">
    <header class="topbar" data-shell="topbar"></header>

    <div class="content">

      <div id="filter-host"></div>
      <div id="ctx-notice"></div>

      <section class="card">
        <div class="card-head">
          <div>
            <h2>Lead table</h2>
            <p class="sub" id="table-sub"></p>
          </div>
          <div class="spacer"></div>
          <div id="export-host"></div>
        </div>
        <div style="padding:0 18px" id="export-toast"></div>
        <div class="table-wrap">
          <table class="data" id="lead-table"></table>
        </div>
        <div class="card-foot">
          <div class="pager" id="pager"></div>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <div>
            <h2>Rejection reasons</h2>
            <p class="sub">Grouped, so a pattern is obvious rather than 30 rows apart.</p>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data" id="reject-table"></table>
        </div>
      </section>

    </div>
  </div>
</div>

<script src="assets/data/dataset.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/health.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  'use strict';
  var D = FZData, A = FZApp;

  var PER_PAGE = 50;
  var state = A.params({ defaultRange: '30d' });

  A.shell(state, {
    active: 'leads.html',
    title: 'Lead table',
    subtitle: 'Every lead you sent, what happened to it, and why.'
  });
  A.filterBar(document.getElementById('filter-host'), state,
    ['range', 'campaign', 'subid', 'status', 'sold']);

  var all = D.queryLeads({
    partnerId: state.partnerId,
    from: state.range.from, to: state.range.to,
    campaignId: state.campaignId, subid: state.subid
  });

  var rows = all.filter(function (r) {
    if (state.status === 'paid' && r.status !== 'paid') return false;
    if (state.status === 'free' && r.status !== 'free') return false;
    if (state.sold === 'all') return true;
    if (state.sold === 'ph') return r.soldType === 'priority' || r.soldType === 'hot';
    if (state.sold === 'unsold') return !r.soldType;
    return r.soldType === state.sold;
  });
  rows.sort(function (a, b) { return b.receivedAt - a.receivedAt; });

  /* ---- columns ----------------------------------------------------------
     THE WHOLE COLUMN SET COMES FROM THE REGISTRY. Nothing here decides what a
     partner may see — data.js already did, per comp model, and the fields a
     partner may not see are not on the row objects at all. This only decides
     which of the available columns are worth rendering versus export-only. */
  var available = D.columnsForPartner(state.partnerId);
  var tableCols = available.filter(function (c) { return !c.csvOnly; });

  /* ---- context notice -------------------------------------------------- */
  (function () {
    var comps = state.comps;
    var mixed = comps.length > 1;
    var seesRevenue = comps.some(function (c) { return c.seesRevenue; });

    var msg;
    if (mixed) {
      msg = 'This account runs more than one comp model, so the table is mixed: ' +
        'revenue columns are populated on rows from revenue-share campaigns and ' +
        'are not present at all on rows from CPL campaigns.';
    } else if (seesRevenue) {
      msg = 'Sale amount and your share show on every row that sold — <strong>including ' +
        'leads we did not accept</strong>. Filter Status to "Rejected" to see those.';
    } else {
      msg = 'A rejected lead shows its reason and stops there — no sold type, no dates, ' +
        'no price. Those fields are not in this comp model\'s query for a rejected row.';
    }
    document.getElementById('ctx-notice').innerHTML =
      '<div class="notice notice-info"><span class="ico">◆</span><div>' + msg + '</div></div>';
  })();

  /* ---- table ----------------------------------------------------------- */
  var totalPages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
  var page = Math.min(state.page, totalPages);
  var slice = rows.slice((page - 1) * PER_PAGE, page * PER_PAGE);

  var head = '<thead><tr>' + tableCols.map(function (c) {
    return '<th' + (c.align === 'num' ? ' class="num"' : '') +
      (c.group === 'revenue' ? ' class="revshare-col"' : '') + '>' + A.esc(c.label) + '</th>';
  }).join('') + '</tr></thead>';

  var body = slice.map(function (r) {
    return '<tr>' + tableCols.map(function (c) {
      var cls = [];
      if (c.align === 'num') cls.push('num');
      if (c.group === 'revenue') cls.push('revshare-col');
      var nowrap = (c.key === 'receivedAt' || c.key === 'soldAt' || c.key === 'assetBand');
      return '<td' + (cls.length ? ' class="' + cls.join(' ') + '"' : '') +
        (nowrap ? ' style="white-space:nowrap"' : '') + '>' +
        A.leadCell(c, r, state) + '</td>';
    }).join('') + '</tr>';
  }).join('');

  document.getElementById('lead-table').innerHTML = head + '<tbody>' +
    (body || '<tr><td colspan="' + tableCols.length + '" class="empty">No leads match these filters.</td></tr>') +
    '</tbody>';

  (function () {
    var immature = rows.filter(function (r) { return !D.isMature(r); }).length;
    document.getElementById('table-sub').innerHTML =
      A.fmtInt(rows.length) + ' leads · ' + A.esc(A.rangeSummary(state.range)) +
      ' · ' + tableCols.length + ' columns available to you' +
      (immature
        ? ' · <strong>' + A.fmtInt(immature) + '</strong> still cooking, so a blank sold ' +
          'column on a recent lead is expected'
        : '');
  })();

  /* ---- pager ----------------------------------------------------------- */
  (function () {
    var host = document.getElementById('pager');
    if (totalPages <= 1) { host.textContent = A.fmtInt(rows.length) + ' leads'; return; }
    var startN = (page - 1) * PER_PAGE + 1;
    var endN = Math.min(page * PER_PAGE, rows.length);
    var html = '<span>Showing ' + A.fmtInt(startN) + '–' + A.fmtInt(endN) + ' of ' + A.fmtInt(rows.length) + '</span>';
    if (page > 1) {
      html += '<a class="btn btn-sm" href="' + A.linkTo('leads.html', state,
        { status: state.status, sold: state.sold, p: page - 1 }) + '">← Prev</a>';
    }
    html += '<span>Page ' + page + ' of ' + totalPages + '</span>';
    if (page < totalPages) {
      html += '<a class="btn btn-sm" href="' + A.linkTo('leads.html', state,
        { status: state.status, sold: state.sold, p: page + 1 }) + '">Next →</a>';
    }
    host.innerHTML = html;
  })();

  /* ---- export ----------------------------------------------------------- */
  /* Exports the full filtered set, not the visible page — this is the file
     currently assembled by hand every day. Same registry, so the CSV cannot
     carry a column the table is not allowed to show. */
  A.exportControl(document.getElementById('export-host'), function () {
    var cols = available.map(function (c) {
      return {
        label: c.label,
        value: function (r) { return A.leadCsvValue(c, r, state); }
      };
    });
    return {
      rows: rows, columns: cols,
      filename: 'leads_' + A.isoDate(state.range.from) + '_' + A.isoDate(state.range.to) + '.csv',
      toastHost: document.getElementById('export-toast')
    };
  });

  /* ---- rejection grouping ------------------------------------------------ */
  (function () {
    var counts = {}, freeTotal = 0;
    all.forEach(function (r) {
      if (r.rejectReason) { counts[r.rejectReason] = (counts[r.rejectReason] || 0) + 1; freeTotal++; }
    });
    var entries = Object.keys(counts).map(function (k) { return { key: k, n: counts[k] }; })
      .sort(function (a, b) { return b.n - a.n; });

    var head = '<thead><tr><th>Reason</th><th class="num">Leads</th>' +
      '<th class="num">% of rejected</th><th>What fixes it</th><th></th></tr></thead>';
    var body = entries.map(function (e) {
      var link = e.key === 'duplicate'
        ? '<a class="btn btn-sm" href="' + A.linkTo('duplicate-check.html', state) + '">Screen numbers →</a>'
        : '';
      return '<tr><td>' + A.esc(D.rejectLabel(e.key, state.partnerId)) + '</td>' +
        '<td class="num">' + A.fmtInt(e.n) + '</td>' +
        '<td class="num">' + A.fmtPct(freeTotal ? e.n / freeTotal : 0, 1) + '</td>' +
        '<td style="color:var(--ink-2)">' + A.esc(D.rejectFix(e.key)) + '</td>' +
        '<td style="text-align:right">' + link + '</td></tr>';
    }).join('');

    document.getElementById('reject-table').innerHTML = head + '<tbody>' +
      (body || '<tr><td colspan="5" class="empty">No rejected leads in this window.</td></tr>') + '</tbody>';
  })();

})();
</script>
</body>
</html>
