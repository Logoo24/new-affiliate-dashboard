<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead table — Financialize Partner Portal</title>
<link rel="stylesheet" href="assets/css/dashboard.css">
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<div class="app">
  <aside class="sidebar" data-shell="sidebar"></aside>

  <div class="main">
    <header class="topbar" data-shell="topbar"></header>

    <div class="content">

      <div id="filter-host"></div>

      <section class="card">
        <div class="card-head">
          <div>
            <h2>Lead table</h2>
            <p class="sub" id="table-sub"></p>
          </div>
          <div class="spacer"></div>
          <div style="display:flex;gap:8px;align-items:center">
            <div id="cols-host"></div>
            <div id="export-host"></div>
          </div>
        </div>
        <div style="padding:0 18px" id="export-toast"></div>
        <div class="table-wrap">
          <table class="data" id="lead-table"></table>
        </div>
        <div class="card-foot">
          <div class="pager" id="pager"></div>
        </div>
      </section>

      <!-- The grouped rejection-reason summary that used to sit here now
           lives only on the Performance page — same numbers, one home. -->

    </div>
  </div>
</div>

<script src="assets/data/dataset.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/health.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/tables.js"></script>
<script>
(function () {
  'use strict';
  var D = FZData, A = FZApp;

  /* Page size is a USER PREFERENCE, like column choices and widths — a
     media buyer scanning 56k rows at 50/page faces 1,100 pages. Persisted
     the same way as the rest of the table prefs (sessionStorage in the
     mock; affiliate_users in production — ADMIN-MAPPING B10). */
  var PAGE_SIZES = [50, 100, 250];
  var PER_PAGE = (function () {
    try {
      var v = parseInt(sessionStorage.getItem('fz_pagesize'), 10);
      return PAGE_SIZES.indexOf(v) !== -1 ? v : 50;
    } catch (e) { return 50; }
  })();
  var state = A.params({ defaultRange: '30d' });

  A.shell(state, {
    active: 'leads.html',
    title: 'Lead table',
    subtitle: 'Every lead you sent, what happened to it, and why.'
  });
  A.filterBar(document.getElementById('filter-host'), state,
    ['range', 'campaign', 'subid', 'status', 'sold']);

  var all = D.queryLeads({
    partnerId: state.partnerId,
    from: state.range.from, to: state.range.to,
    campaignId: state.campaignId, subid: state.subid
  });

  var rows = all.filter(function (r) {
    if (state.status === 'paid' && r.status !== 'paid') return false;
    if (state.status === 'free' && r.status !== 'free') return false;
    if (state.sold === 'all') return true;
    if (state.sold === 'ph') return r.soldType === 'priority' || r.soldType === 'hot';
    if (state.sold === 'unsold') return !r.soldType;
    return r.soldType === state.sold;
  });
  rows.sort(function (a, b) { return b.receivedAt - a.receivedAt; });

  /* ---- columns ----------------------------------------------------------
     THE WHOLE COLUMN SET COMES FROM THE REGISTRY. Nothing here decides what a
     partner may see — data.js already did, per comp model, and the fields a
     partner may not see are not on the row objects at all. This only decides
     which of the available columns are worth rendering versus export-only. */
  var available = D.columnsForPartner(state.partnerId);
  var tableCols = available.filter(function (c) { return !c.csvOnly; });

  /* ---- table -------------------------------------------------------------
     The lead table paginates, so sorting has to happen on the FULL filtered
     set and then re-paginate. Sorting the 50 rendered rows would sort one
     page and read as if it had sorted everything. `rows` is re-assigned by
     the sort callback and the table re-renders from page 1. */
  var page = 1;

  /* The value a column sorts on, taken from the row object rather than the
     rendered cell — so a sold-type badge sorts by tier, a date sorts by
     time, and a blank sorts last regardless of how it is displayed. */
  function sortValueFor(row, colIdx) {
    var c = tableCols[colIdx];
    if (!c) return '';
    switch (c.key) {
      case 'receivedAt': return row.receivedAt ? row.receivedAt.getTime() : '';
      case 'soldAt':     return row.soldAt ? row.soldAt.getTime() : '';
      case 'soldType':   return row.soldType ? D.SOLD_TYPES[row.soldType].points : '';
      case 'assetBand':  return row.assetBand
                           ? D.ASSET_BANDS.map(function (b) { return b.key; }).indexOf(row.assetBand)
                           : '';
      case 'rejectReason': return row.rejectReason
        ? (row.rejectReasonRaw || D.rejectLabel(row.rejectReason)) : '';
      case 'status':     return row.status === 'paid' ? 1 : 0;
      case 'dow':        return row.receivedAt ? row.receivedAt.getDay() : '';
      /* A lead that never sold has no sale amount — it is blank, not zero.
         Returning 0 would float every unsold lead to the top of an ascending
         sort while the cell still shows "—", which reads as broken. */
      case 'saleAmount':
      case 'partnerShare':
        return row[c.key] ? row[c.key] : '';
      default:
        var v = row[c.key];
        return (v === null || v === undefined) ? '' : v;
    }
  }

  function renderTable() {
    var totalPages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
    page = Math.min(page, totalPages);
    var slice = rows.slice((page - 1) * PER_PAGE, page * PER_PAGE);

    var head = '<thead><tr>' + tableCols.map(function (c) {
      return '<th' + (c.align === 'num' ? ' class="num"' : '') +
        (c.group === 'revenue' ? ' class="revshare-col"' : '') + '>' + A.esc(c.label) + '</th>';
    }).join('') + '</tr></thead>';

    var body = slice.map(function (r) {
      return '<tr>' + tableCols.map(function (c) {
        var cls = [];
        if (c.align === 'num') cls.push('num');
        if (c.group === 'revenue') cls.push('revshare-col');
        var nowrap = (c.key === 'receivedAt' || c.key === 'soldAt' || c.key === 'assetBand');
        return '<td' + (cls.length ? ' class="' + cls.join(' ') + '"' : '') +
          (nowrap ? ' style="white-space:nowrap"' : '') + '>' +
          A.leadCell(c, r, state) + '</td>';
      }).join('') + '</tr>';
    }).join('');

    document.getElementById('lead-table').innerHTML = head + '<tbody>' +
      (body || '<tr><td colspan="' + tableCols.length + '" class="empty">No leads match these filters.</td></tr>') +
      '</tbody>';

    var immature = rows.filter(function (r) { return !D.isMature(r); }).length;
    document.getElementById('table-sub').innerHTML =
      A.fmtInt(rows.length) + ' leads · ' + A.esc(A.rangeSummary(state.range)) +
      ' · ' + tableCols.length + ' columns available to you' +
      (immature
        ? ' · <strong>' + A.fmtInt(immature) + '</strong> still cooking, so a blank sold ' +
          'column on a recent lead is expected'
        : '');

    renderPager(totalPages);
    wireTable();
  }

  function renderPager(totalPages) {
    var host = document.getElementById('pager');
    var sizeSel = '<label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;' +
      'color:var(--ink-2)">Rows <select id="page-size">' +
      PAGE_SIZES.map(function (s) {
        return '<option value="' + s + '"' + (s === PER_PAGE ? ' selected' : '') + '>' + s + '</option>';
      }).join('') + '</select></label>';

    if (totalPages <= 1) {
      host.innerHTML = '<span>' + A.fmtInt(rows.length) + ' leads</span>' +
        (rows.length > PAGE_SIZES[0] ? sizeSel : '');
    } else {
      var startN = (page - 1) * PER_PAGE + 1;
      var endN = Math.min(page * PER_PAGE, rows.length);
      host.innerHTML =
        '<span>Showing ' + A.fmtInt(startN) + '–' + A.fmtInt(endN) + ' of ' + A.fmtInt(rows.length) + '</span>' +
        sizeSel +
        (page > 1 ? '<button class="btn btn-sm" data-pg="' + (page - 1) + '">← Prev</button>' : '') +
        '<span>Page ' + page + ' of ' + A.fmtInt(totalPages) + '</span>' +
        (page < totalPages ? '<button class="btn btn-sm" data-pg="' + (page + 1) + '">Next →</button>' : '');
    }

    var ps = host.querySelector('#page-size');
    if (ps) ps.addEventListener('change', function () {
      PER_PAGE = parseInt(ps.value, 10);
      try { sessionStorage.setItem('fz_pagesize', String(PER_PAGE)); } catch (e) {}
      page = 1;
      renderTable();
    });

    /* Paging is in-page now rather than a query-string reload, so the active
       sort and any column changes survive it. */
    host.querySelectorAll('[data-pg]').forEach(function (b) {
      b.addEventListener('click', function () {
        page = parseInt(b.dataset.pg, 10);
        renderTable();
        document.getElementById('lead-table').scrollIntoView({ block: 'start', behavior: 'smooth' });
      });
    });
  }

  var tableApi = null;
  function wireTable() {
    tableApi = FZTable.enhance(document.getElementById('lead-table'), {
      controlsHost: document.getElementById('cols-host'),
      labels: tableCols.map(function (c) { return c.label; }),
      data: rows,
      sortValue: sortValueFor,
      onSort: function (sorted) {
        rows = sorted;
        page = 1;              /* a new sort starts at the top of the set */
        renderTable();
      }
    });
  }

  renderTable();
  if (tableApi) tableApi.applyStoredSort();

  /* ---- export ----------------------------------------------------------- */
  /* Exports the full filtered set, not the visible page — this is the file
     currently assembled by hand every day. Same registry, so the CSV cannot
     carry a column the table is not allowed to show. */
  A.exportControl(document.getElementById('export-host'), function () {
    var cols = available.map(function (c) {
      return {
        label: c.label,
        value: function (r) { return A.leadCsvValue(c, r, state); }
      };
    });
    return {
      rows: rows, columns: cols,
      filename: 'leads_' + A.isoDate(state.range.from) + '_' + A.isoDate(state.range.to) + '.csv',
      toastHost: document.getElementById('export-toast')
    };
  });

})();
</script>
</body>
</html>
