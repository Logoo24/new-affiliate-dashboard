<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compensation — Financialize Partner Portal</title>
<link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

<div class="app">
  <aside class="sidebar" data-shell="sidebar"></aside>

  <div class="main">
    <header class="topbar" data-shell="topbar"></header>

    <div class="content">

      <div id="filters"></div>

      <div class="grid-2">
        <!-- What they earned in the selected window, on the basis their
             invoice actually uses. -->
        <section class="card">
          <div class="card-head">
            <div>
              <h2>Projected compensation<span id="proj-tip-host"></span></h2>
              <p class="sub" id="earned-sub"></p>
            </div>
          </div>
          <div class="card-body">
            <div class="tile-label" style="margin-top:2px" id="earned-label">Estimated total</div>
            <div class="tile-value" id="earned-total" style="font-size:34px">—</div>
            <div class="tile-sub" id="earned-basis"></div>
            <div class="tile-sub" id="earned-caveat" style="margin-top:8px;line-height:1.5"></div>
            <div id="earned-extra"></div>
          </div>
          <div class="table-wrap">
            <table class="data" id="earned-table"></table>
          </div>
          <div class="card-foot" id="earned-foot"></div>
        </section>

        <!-- Same billing card as the Partnership summary — one source of
             truth for terms, rendered in the place money questions live. -->
        <section class="card">
          <div class="card-head">
            <div>
              <h2>Billing details</h2>
              <p class="sub">Terms and who to ask.</p>
            </div>
          </div>
          <div class="card-body">
            <div class="tile-label" style="margin-top:2px">Expected next payment<span id="nextpay-tip-host"></span></div>
            <div class="tile-value" id="billing-next" style="font-size:24px">—</div>
            <div class="tile-sub" id="billing-terms"></div>
            <div class="tile-sub" id="billing-cadence" style="margin-top:8px;line-height:1.5"></div>
            <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)" id="billing-contacts"></div>
          </div>
        </section>
      </div>

      <section class="card">
        <div class="card-head">
          <div>
            <h2>Lead statements</h2>
            <p class="sub" id="stmt-sub"></p>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data" id="stmt-table"></table>
        </div>
        <div class="card-foot" id="stmt-foot"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <div>
            <h2>Pixel unfire report</h2>
            <p class="sub" id="unfire-sub"></p>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data" id="unfire-table"></table>
        </div>
        <div class="card-foot" id="unfire-foot"></div>
        <div class="card-body" id="unfire-note" style="padding-top:0"></div>
      </section>

    </div>
  </div>
</div>

<script src="assets/data/dataset.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/health.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/tables.js"></script>
<script>
(function () {
  'use strict';
  var D = FZData, A = FZApp;

  /* Money defaults to the month the next invoice covers, not the last 7
     days — "what will the check be" is a month-shaped question. */
  var state = A.params({ defaultRange: 'mtd' });
  var p = state.partner;

  A.shell(state, {
    active: 'compensation.html',
    title: 'Compensation',
    subtitle: 'What you’ve earned, your monthly statements, and any adjustments.'
  });

  A.filterBar(document.getElementById('filters'), state, ['range']);

  /* "−$102.00", not the "$-102.00" that fmtMoney produces on a negative. */
  function fmtSigned(n) {
    return n < 0 ? '−' + A.fmtMoney(-n) : A.fmtMoney(n);
  }

  var BASIS_TIP = {
    revshare: 'Revenue share is paid on the date a lead sells, so this window counts every sale that closed inside it — including sales of leads submitted earlier, and your share of any sale of a lead we declined.',
    cpl: 'CPL is billed on acceptance, so this window counts every lead accepted inside it. Whether it later sells does not change what you are owed.'
  };
  /* EVERY MONEY FIGURE ON THIS PAGE IS AN ESTIMATE until the month closes,
     the report goes out and the invoice is issued. That is not a hedge, it is
     how the billing actually works: weekly audits remove wrongly accepted
     leads, rev-share sales keep landing against leads already sent, and rates
     are applied at invoice time. A partner who reads any of these as final
     will reconcile against a different number and open a support ticket.

     So the word "estimated" or "projected" rides on every one of them rather
     than sitting once in a footnote. */
  var ESTIMATE_TIP = 'An estimate, not a bill. It moves until the month closes and your ' +
    'statement is issued: we audit accepted leads weekly and remove any that should not have ' +
    'been accepted, and revenue-share sales keep landing against leads you have already sent. ' +
    'Your monthly statement is the final figure and the invoice follows it.';
  var AUDIT_TIP = ESTIMATE_TIP;

  /* ---- earned this period ------------------------------------------------ */
  (function () {
    var pay = D.payoutForWindow({ partnerId: state.partnerId,
                                  from: state.range.from, to: state.range.to });

    document.getElementById('proj-tip-host').innerHTML = A.tip(ESTIMATE_TIP);
    document.getElementById('earned-sub').textContent =
      'Estimated, on the basis your invoice uses. Final on your monthly statement.';
    document.getElementById('earned-label').innerHTML =
      'Estimated total' + A.tip(ESTIMATE_TIP);
    document.getElementById('earned-total').textContent =
      pay.known || pay.total ? A.fmtMoney(pay.total) : '—';

    var bits = [];
    if (pay.acceptedCount) bits.push(A.fmtInt(pay.acceptedCount) + ' accepted leads, billed on the received date');
    if (pay.soldCount) bits.push(A.fmtInt(pay.soldCount) + ' sales, paid on the sold date');
    document.getElementById('earned-basis').textContent =
      bits.join(' · ') || 'Nothing billable in this window.';
    document.getElementById('earned-caveat').innerHTML =
      '<strong>These are estimates.</strong> Every figure on this page moves until the month ' +
      'closes and your statement is issued — that is the final number, and the invoice ' +
      'follows it. Weekly audits remove any leads that should not have been accepted.';

    /* Effective CPL — moved here from Performance. CPL only, and only when
       every CPL campaign in scope has a rate on file. */
    if (pay.effectiveCpl != null) {
      document.getElementById('earned-extra').innerHTML =
        '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">' +
          '<div class="tile-label">Estimated effective cost per lead' +
            A.tip('Your CPL spend in this window divided by every lead you submitted — accepted or not. Rejected leads cost you nothing, so this reads below your rate card; the gap between the two is your acceptance rate at work.') +
          '</div>' +
          '<div class="tile-value" style="font-size:24px">' + A.fmtMoney(pay.effectiveCpl) + '</div>' +
          '<div class="tile-sub">across ' + A.fmtInt(pay.cplRaw) +
            ' leads submitted, accepted or not' +
            (pay.cplRawExcluded
              ? ' · excludes ' + A.fmtInt(pay.cplRawExcluded) +
                ' on campaigns with no rate on file'
              : '') + '</div>' +
        '</div>';
    }

    var head = '<thead><tr><th>Campaign</th><th>Model</th><th>Basis</th>' +
      '<th style="text-align:right">Leads</th>' +
      '<th style="text-align:right">Estimated amount</th></tr></thead>';
    var body = pay.campaigns.map(function (c) {
      var basis = c.comp === 'revshare' ? 'Sold date' : 'Received date';
      return '<tr>' +
        '<td><strong>' + A.esc(c.name) + '</strong></td>' +
        '<td>' + (c.comp === 'revshare' ? 'Revenue share' : 'CPL') + '</td>' +
        '<td>' + basis + A.tip(BASIS_TIP[c.comp]) + '</td>' +
        '<td style="text-align:right">' + A.fmtInt(c.count) + '</td>' +
        '<td style="text-align:right">' +
          (c.known ? A.fmtMoney(c.amount)
                   : '—' + A.tip('Your rate for this campaign is not connected yet, so we are not showing a figure rather than showing a guess. It fills in automatically once it is on your campaign record — ask your account manager if you need it sooner.')) +
        '</td></tr>';
    }).join('');
    document.getElementById('earned-table').innerHTML = head + '<tbody>' +
      (body || '<tr><td colspan="5" class="empty">No compensation in this window.</td></tr>') +
      '</tbody>';

    document.getElementById('earned-foot').innerHTML =
      'Estimated until your monthly statement. Revenue share counts every sale inside the ' +
      'window — including your share of sales of leads we declined. CPL counts leads on ' +
      'acceptance; a rejected lead is never billed.';
  })();

  /* ---- billing details (same source as the Partnership summary) ---------- */
  (function () {
    var pay = D.nextPaymentDate();
    document.getElementById('nextpay-tip-host').innerHTML =
      A.tip('The date we expect your payment to land, based on your billing terms. It follows ' +
            'the monthly statement rather than setting it — if the month closes late, this ' +
            'moves with it.');
    document.getElementById('billing-next').textContent =
      A.fmtDate(pay.date) + (pay.isToday ? ' — today' : '');
    document.getElementById('billing-terms').textContent =
      p.billingPeriod + ' · ' + p.billingBasis.charAt(0).toLowerCase() + p.billingBasis.slice(1) +
      ' · payment usually lands three business days after the month closes';
    document.getElementById('billing-cadence').innerHTML =
      'We send your lead report immediately after the month closes — ' +
      '<strong>please return your invoice as soon as you receive it</strong> so payment ' +
      'is not held up.';
    document.getElementById('billing-contacts').innerHTML =
      D.BILLING_CONTACTS.map(function (c) {
        return '<div style="margin-bottom:9px">' +
          '<div style="font-size:13.5px;font-weight:600">' + A.esc(c.name) +
          ' <span style="font-weight:400;color:var(--ink-muted)">· ' + A.esc(c.note) + '</span></div>' +
          '<div style="font-size:13px"><a href="mailto:' + A.esc(c.email) + '">' + A.esc(c.email) + '</a></div>' +
        '</div>';
      }).join('');
  })();

  /* ---- lead statements ---------------------------------------------------
     Admin-linked Google Sheets, one per closed month — NOT affected by the
     date filter above. A month with no URL renders "Not linked yet", never a
     dead button (same rule as the documents library). */
  (function () {
    var st = D.leadStatementsFor(state.partnerId);

    document.getElementById('stmt-sub').innerHTML =
      'One statement per closed month' +
      A.tip('Statements are prepared in Google Sheets on the first business day after the month closes and linked here by your account manager. They are the final, reconciled version of the figures above.');

    var head = '<thead><tr><th>Statement</th><th>Generated</th><th></th></tr></thead>';

    /* Current month first, as an in-progress row — it shows the cadence
       instead of leaving the newest month mysteriously absent. */
    var rows = '<tr>' +
      '<td style="color:var(--ink-2)"><strong>' + A.esc(st.current.label) + '</strong> — in progress</td>' +
      '<td style="color:var(--ink-muted)">expected ' + A.fmtDate(st.current.expectedAt) + '</td>' +
      '<td style="text-align:right"><span class="badge badge-unsold"><span class="dot"></span>Month still open</span></td>' +
      '</tr>';

    rows += st.months.map(function (m) {
      return '<tr>' +
        '<td><strong>' + A.esc(m.label) + '</strong></td>' +
        '<td style="color:var(--ink-2)">' + A.fmtDate(m.generatedAt) + '</td>' +
        '<td style="text-align:right">' +
          (m.url
            ? '<a class="btn btn-sm" href="' + A.esc(m.url) + '" target="_blank" rel="noopener">Open in Google Sheets →</a>'
            : '<span class="badge badge-warn"><span class="dot"></span>Not linked yet</span>' +
              A.tip('Your account manager links each statement shortly after it is generated. If a recent month is missing, it is being prepared — not lost.')) +
        '</td></tr>';
    }).join('');

    document.getElementById('stmt-table').innerHTML = head + '<tbody>' + rows + '</tbody>';

    /* Affiliate-facing wording. The storage spec that used to sit here — a
       Google Sheet URL per affiliate per month — belongs in ADMIN-MAPPING
       §7e, not on a partner's screen. */
    document.getElementById('stmt-foot').innerHTML =
      'Statements are posted on the first business day after the month closes, give or take. ' +
      'A month that is not linked yet is being prepared, not missing.';
  })();

  /* ---- pixel unfire report -----------------------------------------------
     Leads unfired in the weekly audit, with affiliate-safe reasons. Reasons
     come from RETURN_REASONS only — the internal clawback_reason field stays
     forbidden along with the rest of the how-we-work-leads internals. */
  (function () {
    var rows = D.queryUnfires({ partnerId: state.partnerId,
                               from: state.range.from, to: state.range.to });
    /* Whether the unfire feed is connected is a DATA question, not a
       which-file-are-we-reading question: the columns populate when the feed
       is wired and stay blank until then, on any source. */
    var feedLive = rows.some(function (r) { return r.returnedAt || r.reason; });

    document.getElementById('unfire-sub').innerHTML =
      'Leads removed by audit in this window — you are not billed for these' +
      A.tip('We audit accepted leads weekly. A lead that should not have been accepted is unfired: the charge is removed from your statement (CPL) or the share reversed (revenue share). This list is the line-by-line record, so a smaller statement never reads as us shorting you.');

    var head = '<thead><tr><th>Lead ID</th><th>Received</th><th>Campaign</th>' +
      '<th>Unfired' + (feedLive ? '' : A.tip('The date each lead was unfired is not connected yet, so this column is blank. It fills in automatically once that is wired up.')) + '</th>' +
      '<th>Reason</th>' +
      '<th style="text-align:right">Adjustment</th></tr></thead>';

    var total = 0, knownAdj = 0;
    var body = rows.map(function (r) {
      if (r.adjustment != null) { total += r.adjustment; knownAdj++; }
      var reason = r.reason && D.RETURN_REASONS[r.reason];
      return '<tr>' +
        '<td class="lead-id">' + A.esc(r.id) + '</td>' +
        '<td style="white-space:nowrap">' + A.fmtDate(r.receivedAt) + '</td>' +
        '<td>' + A.esc(r.campaignName) + '</td>' +
        '<td style="white-space:nowrap">' + (r.returnedAt ? A.fmtDate(r.returnedAt) : '—') + '</td>' +
        '<td>' + (reason
          ? '<span style="color:var(--ink-2)">' + A.esc(reason.label) + '</span>' + A.tip(reason.desc)
          : '—') + '</td>' +
        /* data-sort: the typographic minus in fmtSigned() is not parseable
           as a number, so hand the sorter the raw value. */
        '<td style="text-align:right"' +
          (r.adjustment != null ? ' data-sort="' + r.adjustment + '"' : '') + '>' +
          (r.adjustment != null ? fmtSigned(r.adjustment) : '—') +
        '</td></tr>';
    }).join('');

    document.getElementById('unfire-table').innerHTML = head + '<tbody>' +
      (body || '<tr><td colspan="6" class="empty">No leads were removed by audit in this window.</td></tr>') +
      '</tbody>';

    /* A summed total is only honest when every row's amount is known — a
       "$0.00" over 335 unknown amounts reads as a real zero. */
    document.getElementById('unfire-foot').innerHTML = rows.length
      ? '<strong>' + A.fmtInt(rows.length) + '</strong> lead' + (rows.length === 1 ? '' : 's') +
        ' unfired in this window' +
        (knownAdj === rows.length
          ? ' · total adjustment <strong>' + fmtSigned(total) + '</strong>'
          : ' · credited amounts are not connected yet')
      : 'Most weeks this list is empty — that is the audit working, not the report failing.';

    /* Blank columns need a reason a PARTNER can act on — in this case,
       "nothing, it is on us". The dependency itself (the unfire feed, and who
       owns connecting it) is tracked in ADMIN-MAPPING A9 and HANDOFF, which
       is where build state belongs. Once the feed is connected this notice
       stops rendering on its own. */
    document.getElementById('unfire-note').innerHTML = feedLive ? '' :
      '<div class="notice notice-info"><span class="ico">◆</span><div>' +
      'The unfire date, the reason and the credited amount are not connected yet, so those ' +
      'columns are blank. The lead IDs and the count are accurate — use them to reconcile a ' +
      'statement, and ask your account manager if you need the detail behind a specific row.' +
      '</div></div>';
  })();

  if (window.FZTable) FZTable.enhanceAll();

})();
</script>
</body>
</html>
