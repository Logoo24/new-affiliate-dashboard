<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partnership summary — Financialize Partner Portal</title>
<link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

<div class="app">
  <aside class="sidebar" data-shell="sidebar"></aside>

  <div class="main">
    <header class="topbar" data-shell="topbar"></header>

    <div class="content">

      <section class="card">
        <div class="card-body" style="padding-top:18px">
          <div class="hero">
            <div>
              <div class="hero-label">Partner</div>
              <div class="hero-figure" id="hero-name" style="font-size:34px;line-height:1.15">—</div>
              <div id="hero-status" style="margin-top:8px"></div>
            </div>
            <div style="flex:1;min-width:260px">
              <div id="hero-comp" style="font-size:14px;font-weight:600;margin-bottom:6px"></div>
              <p class="hero-note" id="hero-note"></p>
            </div>
          </div>
        </div>
        <div class="card-foot" id="hero-foot"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <div>
            <h2>Active campaigns</h2>
            <p class="sub" id="camp-sub"></p>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data" id="campaign-table"></table>
        </div>
        <div class="card-foot" id="camp-foot"></div>
      </section>

      <div class="grid-2">
        <section class="card">
          <div class="card-head">
            <div>
              <h2>Account details</h2>
              <p class="sub">The commercial terms this account runs on.</p>
            </div>
          </div>
          <div class="table-wrap">
            <table class="data" id="account-table"></table>
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <div>
              <h2>How we work your leads</h2>
              <p class="sub">Our hours, and what they mean for when you send.</p>
            </div>
          </div>
          <div class="table-wrap">
            <table class="data" id="hours-table"></table>
          </div>
          <div class="card-foot" id="hours-foot"></div>
        </section>
      </div>

    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/health.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  'use strict';
  var D = FZData, A = FZApp;

  var state = A.params();
  var p = state.partner;

  A.shell(state, {
    active: 'partnership.html',
    title: 'Partnership summary',
    subtitle: 'Who you are to us, what you are running, and on what terms.'
  });

  /* ---- hero ------------------------------------------------------------- */
  document.getElementById('hero-name').textContent = p.name;
  document.getElementById('hero-status').innerHTML =
    '<span class="badge badge-good" style="font-size:12px;padding:4px 12px">' +
    '<span class="dot"></span>' + A.esc(p.status) + '</span>' +
    ' <span class="quota" style="margin-left:8px">Partner since ' + A.esc(p.since) + '</span>';
  /* Deliberately NOT the comp model. It is set per campaign and belongs in the
     campaigns table below, not beside the account name. */
  document.getElementById('hero-comp').textContent =
    p.products + ' · ' + p.integration;
  document.getElementById('hero-note').textContent =
    'Every figure in this portal is scoped to this account. Comp model is set per campaign, ' +
    'so what you can see on a lead depends on which campaign sent it.';

  document.getElementById('hero-foot').innerHTML =
    '<strong>Account manager:</strong> ' + A.esc(p.accountManager) +
    ' · <strong>Your contact on file:</strong> ' + A.esc(p.partnerContact);

  /* ---- active campaigns -------------------------------------------------
     CID and comp model are the two things partners ask for by name. "View
     details" carries the campaign straight onto Performance with the filter
     already applied, which is the same query-string state the filter row
     writes — no special-case route. */
  (function () {
    var camps = D.activeCampaignsFor(state.partnerId);

    var head = '<thead><tr><th>CID</th><th>Campaign</th><th>Product</th>' +
      '<th>Comp model</th><th>Launched</th><th></th></tr></thead>';

    var body = camps.map(function (c) {
      var cm = D.compModel(c.comp);
      var detail = c.comp === 'revshare'
        ? cm.label + ' — ' + Math.round(p.revSharePct * 100) + '%'
        : p.rateCard;
      return '<tr>' +
        '<td class="lead-id">' + A.esc(c.id) + '</td>' +
        '<td><strong>' + A.esc(c.name) + '</strong></td>' +
        '<td>' + A.esc(c.product) + '</td>' +
        '<td>' + A.esc(detail) + '</td>' +
        '<td style="color:var(--ink-2);white-space:nowrap">' + A.esc(c.launched) + '</td>' +
        '<td style="text-align:right">' +
          '<a class="btn btn-sm" href="' +
            A.linkTo('index.html', state, { campaign: c.id, subid: 'all' }) +
          '">View details →</a>' +
        '</td>' +
        '</tr>';
    }).join('');

    document.getElementById('campaign-table').innerHTML = head + '<tbody>' +
      (body || '<tr><td colspan="6" class="empty">No active campaigns on this account.</td></tr>') +
      '</tbody>';

    document.getElementById('camp-sub').textContent =
      camps.length + (camps.length === 1 ? ' campaign' : ' campaigns') + ' live right now.';

    /* A mixed account is the case the column rules exist for, so say so
       plainly rather than letting the lead table surprise them. */
    var comps = state.comps;
    document.getElementById('camp-foot').innerHTML = comps.length > 1
      ? 'This account runs <strong>' + comps.length + ' comp models</strong>. ' +
        'Revenue columns appear on lead rows from revenue-share campaigns only.'
      : 'All campaigns on this account bill on <strong>' + A.esc(comps[0].label) + '</strong>. ' +
        A.esc(comps[0].note);
  })();

  /* ---- account details --------------------------------------------------- */
  (function () {
    /* Comp model is intentionally absent — it is per campaign and is listed
       against each one in the table above. A single account-level value here
       would be wrong the moment a partner runs two models. */
    var rows = [
      ['Products', p.products],
      ['Integration', p.integration + ' — ' + p.integrationNote],
      /* The negotiated band is a commercial term, not a data error. It has
         already cost a $5,194 invoice variance by being treated as one. */
      ['Accepted age band', p.ageBand + ' — ' + p.ageBandNote],
      ['Billing', p.billing],
      ['Exclusivity', p.exclusivity],
      ['Partner since', p.since]
    ];
    var body = rows.map(function (r) {
      return '<tr><th style="width:34%;text-align:left;font-weight:600">' + A.esc(r[0]) + '</th>' +
        '<td>' + A.esc(r[1]) + '</td></tr>';
    }).join('');
    document.getElementById('account-table').innerHTML = '<tbody>' + body + '</tbody>';
  })();

  /* ---- operating hours --------------------------------------------------- */
  (function () {
    var H = D.OPERATING_HOURS;
    var rows = [
      ['Monday – Friday', '9:00 AM – 7:00 PM local time in every timezone we cover ' +
        '(9:00 AM – 10:00 PM ET end to end)'],
      ['Saturday', '9:00 AM – 8:00 PM ET, lighter staffing'],
      ['Sunday', 'Closed — anything landing Sunday sits until Monday morning'],
      ['Ideal send windows', D.IDEAL_WINDOWS.map(function (w) { return w.label; }).join('  ·  ') +
        ' (your consumer\'s local time, Mon–Fri)']
    ];
    var body = rows.map(function (r) {
      return '<tr><th style="width:34%;text-align:left;font-weight:600">' + A.esc(r[0]) + '</th>' +
        '<td>' + A.esc(r[1]) + '</td></tr>';
    }).join('');
    document.getElementById('hours-table').innerHTML = '<tbody>' + body + '</tbody>';

    document.getElementById('hours-foot').innerHTML =
      A.esc(D.COVERAGE_NOTE) +
      ' <a href="' + A.linkTo('health.html', state) + '">See your current split →</a>';
  })();

})();
</script>
</body>
</html>
