<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partnership summary — Financialize Partner Portal</title>
<link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

<div class="app">
  <aside class="sidebar" data-shell="sidebar"></aside>

  <div class="main">
    <header class="topbar" data-shell="topbar"></header>

    <div class="content">

      <!-- Who they are + who to talk to. Focused on the affiliate, not on
           terms — products, integration and criteria live per campaign and on
           the Targeting page. -->
      <section class="card">
        <div class="card-body" style="padding-top:18px">
          <div class="hero" style="align-items:flex-start">
            <div style="min-width:240px">
              <div class="hero-label">Partner</div>
              <div class="hero-figure" id="hero-name" style="font-size:34px;line-height:1.15">—</div>
              <div id="hero-status" style="margin-top:10px"></div>
            </div>
            <!-- Filled by A.accountManagerBlock() — one shared block, same
                 on every page that shows the account manager. -->
            <div id="am-host" style="display:contents"></div>
            <div class="contact-block">
              <div class="hero-label" style="margin-bottom:6px">Your primary contact</div>
              <div class="who" id="pc-name"></div>
              <div class="role" id="pc-title"></div>
              <div class="mail" id="pc-mail"></div>
              <div class="actions" id="pc-actions"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <div>
            <h2>Active campaigns</h2>
            <p class="sub" id="camp-sub"></p>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data" id="campaign-table"></table>
        </div>
        <div class="card-foot" id="camp-foot"></div>
      </section>

      <!-- Partnership metrics -->
      <div class="grid-3">
        <a class="card gauge-card" id="gauge-link" href="health.html">
          <div class="card-head">
            <div>
              <h2>Affiliate health score<span id="hs-tip-host"></span></h2>
              <p class="sub">How healthy is your traffic?</p>
            </div>
          </div>
          <div class="card-body">
            <div class="gauge-wrap" id="gauge"></div>
          </div>
        </a>

        <section class="card">
          <div class="card-head">
            <div>
              <h2>Volume</h2>
              <p class="sub">How much are you sending?</p>
            </div>
          </div>
          <div class="card-body">
            <div class="tile-label" style="margin-top:2px">Average weekly volume</div>
            <div class="tile-value" id="vol-weekly" style="font-size:34px">—</div>
            <div class="tile-sub" id="vol-sub"></div>
            <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
              <div class="tile-label">Accepted, last 30 days</div>
              <div class="tile-value" id="vol-accepted" style="font-size:24px">—</div>
              <div class="tile-sub" id="vol-accepted-sub"></div>
            </div>
          </div>
        </section>

        <!-- The whole card walks through to the Compensation page. A plain
             <a> wrapper would nest the mailto links inside it (invalid and
             misclick-prone), so the click is wired in JS with inner links
             excluded. -->
        <section class="card gauge-card" id="billing-card" role="link" tabindex="0"
                 style="cursor:pointer" aria-label="Billing details — open the Compensation page">
          <div class="card-head">
            <div>
              <h2>Billing details</h2>
              <p class="sub" id="billing-sub"></p>
            </div>
          </div>
          <div class="card-body">
            <div class="tile-label" style="margin-top:2px">Expected next payment</div>
            <div class="tile-value" id="billing-next" style="font-size:24px">—</div>
            <div class="tile-sub" id="billing-terms"></div>
            <div class="tile-sub" id="billing-cadence" style="margin-top:8px;line-height:1.5"></div>
            <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)" id="billing-contacts"></div>
            <div style="font-size:13px;color:var(--brand-coral);font-weight:600;margin-top:10px">
              Compensation &amp; statements →</div>
          </div>
        </section>
      </div>

    </div>
  </div>
</div>

<script src="assets/data/dataset.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/health.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/tables.js"></script>
<script>
(function () {
  'use strict';
  var D = FZData, A = FZApp, H = FZHealth;

  var state = A.params();
  var p = state.partner;

  A.shell(state, {
    active: 'partnership.html',
    title: 'Partnership summary',
    subtitle: 'Your account at a glance, and who to talk to.'
  });

  /* ---- hero: name + DERIVED status + since ------------------------------ */
  document.getElementById('hero-name').textContent = p.name;

  /* Active = at least one accepted lead in the trailing month. Derived from
     the lead table, never a stored flag — see ADMIN-MAPPING.md §1. */
  var act = D.isPartnerActive(state.partnerId);
  document.getElementById('hero-status').innerHTML =
    '<span class="badge ' + (act.active ? 'badge-good' : 'badge-warn') + '" style="font-size:13px;padding:4px 12px">' +
    '<span class="dot"></span>' + (act.active ? 'Active' : 'Inactive') + '</span>' +
    (D.fmtSince(state.partnerId)
      ? '<div class="quota" style="margin-top:8px">Partner since ' + A.esc(D.fmtSince(state.partnerId)) + '</div>'
      : '<div class="quota" style="margin-top:8px">Partner since ' +
          A.notConnected('Your partnership start date') + '</div>') +
    (!act.active && act.lastAcceptedAt
      ? '<div class="quota" style="margin-top:2px">Last accepted lead ' + A.fmtDate(act.lastAcceptedAt) + '</div>'
      : '');

  /* ---- account manager --------------------------------------------------- */
  document.getElementById('am-host').innerHTML = A.accountManagerBlock();

  /* ---- primary contact --------------------------------------------------- */
  /* One primary per affiliate, editable by any of that affiliate's users.
     Changing it happens on the Account page, where all users are listed. */
  var pc = D.primaryContact(state.partnerId);
  if (pc.placeholder) {
    /* No contact in the source yet — a designed empty state, not a record
       that looks broken. */
    document.getElementById('pc-name').textContent = 'No contact on file yet';
    document.getElementById('pc-title').textContent =
      'Your team\'s primary contact is added during onboarding.';
    document.getElementById('pc-mail').innerHTML =
      '<a href="mailto:logan@financialize.com">Ask Logan to add one</a>';
    document.getElementById('pc-actions').innerHTML = '';
  } else {
    document.getElementById('pc-name').innerHTML = A.esc(pc.name) +
      (pc.away ? ' <span class="away-chip">Away</span>' : '');
    document.getElementById('pc-title').textContent = pc.title;
    document.getElementById('pc-mail').innerHTML =
      '<a href="mailto:' + A.esc(pc.email) + '">' + A.esc(pc.email) + '</a>';
    document.getElementById('pc-actions').innerHTML =
      '<a class="btn btn-sm" href="' + A.linkTo('account.html', state) + '">Change primary contact</a>';
  }

  /* ---- gauge --------------------------------------------------------------
     Drawn by the SHARED dial in charts.js — the same one the Health
     scorecard's hero uses, so the two can never drift apart. */
  document.getElementById('gauge-link').href = A.linkTo('health.html', state);
  /* Computed once and shared with the Active campaigns table below, so the
     account dial and the per-campaign column are the same run of the engine —
     the itemised scores always add up to the dial. */
  document.getElementById('hs-tip-host').innerHTML =
    A.tip('One 0–100 read on how well your traffic is performing, across every campaign on ' +
          'this account and weighted by how much volume each one sends.');

  var health = H.score({ partnerId: state.partnerId });
  (function () {
    var hs = health;
    var sevSuffix = { '': '', 'is-warning': '-warning', 'is-serious': '-serious',
                      'is-critical': '-critical' }[H.meterClass(hs.score)];
    FZCharts.gauge(document.getElementById('gauge'), {
      score: hs.score,
      tier: hs.tier,
      sevSuffix: sevSuffix,
      /* Drawn larger than the default so the dial carries the card rather
         than sitting in the middle of it. The SVG is fluid, so this is the
         cap it fills up to, not a fixed size. */
      scale: 1.35,
      hint: 'See the full breakdown →'
    });
    /* The scorecard flags a thin sample; the summary must too. A brand-new
       partner's first screen showing a bare, confident number is how an
       unearned 48 becomes a fact in someone's deck. */
    if (hs.provisional) {
      document.getElementById('gauge').insertAdjacentHTML('afterend',
        '<div style="text-align:center;margin-top:6px">' +
        '<span class="badge badge-warn"><span class="dot"></span>Provisional</span>' +
        A.tip('Fewer than 100 of this account\'s leads have finished their sales cycle, so ' +
              'read the score as directional rather than final.') + '</div>');
    }
  })();

  /* ---- volume ------------------------------------------------------------- */
  (function () {
    document.getElementById('vol-weekly').textContent = A.fmtInt(D.avgWeeklyVolume(state.partnerId));
    document.getElementById('vol-sub').innerHTML = 'leads per week, all campaigns' +
      A.tip('Averaged over the trailing four weeks, so a single quiet or heavy week does not ' +
            'swing it.');

    var coh = D.cohort({ partnerId: state.partnerId, rateBasis: state.rateBasis });
    document.getElementById('vol-accepted').textContent = A.fmtInt(coh.metrics.paid);
    document.getElementById('vol-accepted-sub').textContent =
      A.fmtPct(coh.metrics.acceptanceRate, 1) + ' acceptance';
  })();

  /* ---- billing ------------------------------------------------------------ */
  (function () {
    document.getElementById('billing-sub').textContent = 'When do you get paid, and who do you ask?';

    /* Card-level click-through to Compensation. Inner links (the billing
       mailtos) keep their own behaviour and must not also fire this. */
    var bc = document.getElementById('billing-card');
    var compHref = A.linkTo('compensation.html', state);
    bc.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('a')) return;
      window.location.href = compHref;
    });
    bc.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target === bc) window.location.href = compHref;
    });

    /* The DATE leads; the net terms demote to a sub-line. Derived: third
       business day after the most recent month close, rolling forward once
       past. */
    var pay = D.nextPaymentDate();
    document.getElementById('billing-next').textContent =
      A.fmtDate(pay.date) + (pay.isToday ? ' — today' : '');
    document.getElementById('billing-terms').textContent =
      p.billingPeriod + ' · ' + p.billingBasis.charAt(0).toLowerCase() + p.billingBasis.slice(1) +
      ' · payment usually lands three business days after the month closes';
    document.getElementById('billing-cadence').innerHTML =
      'We send your lead report immediately after the month closes — ' +
      '<strong>please return your invoice as soon as you receive it</strong> so payment ' +
      'is not held up.';
    document.getElementById('billing-contacts').innerHTML =
      D.BILLING_CONTACTS.map(function (c) {
        return '<div style="margin-bottom:9px">' +
          '<div style="font-size:13.5px;font-weight:600">' + A.esc(c.name) +
          ' <span style="font-weight:400;color:var(--ink-muted)">· ' + A.esc(c.note) + '</span></div>' +
          '<div style="font-size:13px"><a href="mailto:' + A.esc(c.email) + '">' + A.esc(c.email) + '</a></div>' +
        '</div>';
      }).join('');
  })();

  /* ---- active campaigns ---------------------------------------------------
     Comp model shows the MODEL only — Revenue share / Tiered CPL / Flat CPL.
     Rates live behind "View details". */
  (function () {
    var camps = D.activeCampaignsFor(state.partnerId);

    /* Per-campaign scores off the SAME engine run that drew the dial above,
       keyed by campaign id. The campaign is the scoring unit, so this column
       is the dial itemised — not a second, differently-derived number. */
    var scoreById = {};
    health.campaigns.forEach(function (cs) {
      if (cs.campaign) scoreById[cs.campaign.id] = cs;
    });

    /* A campaign score covers the two campaign-grain pillars only (conversion
       and delivered quality). Consistency and compliance are account-level
       behaviour and stay on the affiliate score — same split as the Health
       scorecard's own per-campaign table, so the two pages agree. */
    var scoreTip = A.tip('Conversion and lead quality for this campaign alone, scored against ' +
      'its own campaign class. Account-level behaviour — consistency, compliance — is not ' +
      'repeated per campaign, so these do not simply average to your affiliate score: that is ' +
      'the volume-weighted rollup of these plus the account-level pillars.');

    function scoreCell(cid) {
      var cs = scoreById[cid];
      if (!cs || cs.score == null) {
        return noScore('This campaign has no leads that have finished their sales cycle yet, ' +
                       'so it is not scored. An unscored campaign is not a zero — it is ' +
                       'left out of your affiliate score rather than counted against it.');
      }
      /* The number carries its own band by colour, with the band name in the
         hover bubble beside it — a compact glance column, with the full read
         one click away on the campaign's own pages.

         Colour source: the meter ramp (--meter-fill*), not the status tokens,
         and picked with the same H.meterClass() the gauge above uses, so the
         number and the dial can never disagree. This is the one exception the
         palette allows to "no status by colour alone", and it is the meter
         case exactly: those steps are validated to carry meaning unaided,
         whereas --warning (#fab219, 1.83:1 on white) would be illegible as
         text. The score itself is also its own label — a 44 reads as a 44
         whether or not the colour lands — and the bubble carries the band as
         text for anyone who cannot use the colour.

         SIZE IS LOAD-BEARING: 19px bold clears WCAG's large-text cutoff
         (18.66px bold), so the applicable contrast floor is 3:1 — the same
         one the meter ramp was validated against. At 16px the 4.5:1 body-text
         floor would apply and --meter-fill-warning (#A8730B on white) lands
         at 4.10:1, a fail. Do not shrink this number without moving to a
         text-validated colour. Measured on white: good 6.63 · warning 4.10 ·
         serious 5.30 · critical 6.34; on the dark card all four clear 5.6. */
      /* The bubble carries the band as TEXT — it is what the badge used to
         say. Deliberately not tier.action: that copy ends in "the breakdown
         below", which is true on the Health scorecard and false here. What
         is driving the number lives one click away, on this row's own
         pages. */
      var band = (cs.tier ? A.esc(cs.tier.label) + '.' : 'Not banded yet.') +
        (cs.provisional
          ? ' Provisional — fewer than 100 of this campaign’s leads have finished ' +
            'their sales cycle, so read it as directional rather than final.'
          : '') +
        ' Open the campaign to see what is driving it.';

      return '<td data-sort="' + cs.score + '">' +
        '<span style="display:inline-flex;align-items:center;gap:4px;white-space:nowrap">' +
          '<span style="font-weight:700;font-size:19px;line-height:1.15;color:var(--meter-fill' +
            H.meterClass(cs.score).replace('is-', '-') + ')">' + cs.score + '</span>' +
          A.tip(band) +
        '</span>' +
        '</td>';
    }

    /* data-sort="" so the sorter reads this as EMPTY and floats it to the
       bottom in both directions. Without it the tip glyph rides along in the
       cell's text and an unscored campaign sorts as the string "—i", landing
       above the real scores on an ascending sort. */
    function noScore(why) {
      return '<td data-sort=""><span style="color:var(--ink-muted)">—</span>' +
        A.tip(why) + '</td>';
    }

    var head = '<thead><tr><th>CID</th><th>Campaign</th><th>Product</th>' +
      '<th>Comp model</th><th>Health score' + scoreTip + '</th>' +
      '<th>Launched</th><th></th></tr></thead>';

    var body = camps.map(function (c) {
      return '<tr>' +
        '<td class="lead-id">' + A.esc(c.id) + '</td>' +
        '<td><strong>' + A.esc(c.name) + '</strong></td>' +
        '<td>' + A.esc(c.product) + '</td>' +
        '<td>' + A.esc(D.compLabelForCampaign(c)) + '</td>' +
        scoreCell(c.id) +
        '<td style="color:var(--ink-2);white-space:nowrap">' + A.esc(c.launched) + '</td>' +
        '<td style="text-align:right">' +
          '<a class="btn btn-sm" href="' +
            A.linkTo('performance.html', state, { campaign: c.id, subid: 'all' }) +
          '">View details →</a>' +
        '</td>' +
        '</tr>';
    }).join('');

    /* Campaigns mid-setup surface here too, linking into their tracker —
       a new partner's first visit should land them one click from the
       thing they need to do next. */
    var inSetup = D.setupCampaignsFor(state.partnerId);
    body += inSetup.map(function (c) {
      var su = D.campaignSetup(state.partnerId, c.id);
      return '<tr>' +
        '<td class="lead-id">' + A.esc(String(c.id)) + '</td>' +
        '<td><strong>' + A.esc(c.name) + '</strong></td>' +
        '<td>' + A.esc(c.product) + '</td>' +
        '<td>' + A.esc(D.compLabelForCampaign(c)) + '</td>' +
        noScore('This campaign is still in setup — it starts scoring once it has sent leads ' +
                'that have finished their sales cycle.') +
        '<td><span class="badge badge-warn"><span class="dot"></span>In setup — ' +
          (su.current && su.current.owner !== 'us' ? 'your move' : 'with us') + '</span></td>' +
        '<td style="text-align:right">' +
          '<a class="btn btn-sm" href="' +
            A.linkTo('campaign-setup.html', state, { campaign: c.id }) +
          '">Continue setup →</a>' +
        '</td>' +
        '</tr>';
    }).join('');

    /* Logan's rule for a campaign-less account: one plain sentence. */
    document.getElementById('campaign-table').innerHTML = head + '<tbody>' +
      (body ||
       '<tr><td colspan="7" class="empty">There are no active campaigns on this account.</td></tr>') +
      '</tbody>';

    document.getElementById('camp-sub').textContent =
      camps.length + (camps.length === 1 ? ' campaign' : ' campaigns') + ' live right now' +
      (inSetup.length ? ', ' + inSetup.length + ' in setup' : '') + '.';

    var inactive = D.inactiveCampaignsFor(state.partnerId).length;
    document.getElementById('camp-foot').innerHTML =
      'This account has <strong>' + inactive + '</strong> campaign' + (inactive === 1 ? '' : 's') +
      ' marked as inactive.';
  })();


  /* Sortable / resizable / configurable columns. Every table on this page
     is fully rendered, so sorting the DOM sorts the whole dataset for the
     selected window - not just the visible rows. */
  if (window.FZTable) FZTable.enhanceAll();

})();
</script>
</body>
</html>
