<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partnership summary — Financialize Partner Portal</title>
<link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

<div class="app">
  <aside class="sidebar" data-shell="sidebar"></aside>

  <div class="main">
    <header class="topbar" data-shell="topbar"></header>

    <div class="content">

      <!-- Who they are + who to talk to. Focused on the affiliate, not on
           terms — products, integration and criteria live per campaign and on
           the Targeting page. -->
      <section class="card">
        <div class="card-body" style="padding-top:18px">
          <div class="hero" style="align-items:flex-start">
            <div style="min-width:240px">
              <div class="hero-label">Partner</div>
              <div class="hero-figure" id="hero-name" style="font-size:34px;line-height:1.15">—</div>
              <div id="hero-status" style="margin-top:10px"></div>
            </div>
            <div class="contact-block">
              <div class="hero-label" style="margin-bottom:6px">Account manager</div>
              <div class="who" id="am-name"></div>
              <div class="role" id="am-title"></div>
              <div class="mail" id="am-mail"></div>
              <div class="actions" id="am-actions"></div>
            </div>
            <div class="contact-block">
              <div class="hero-label" style="margin-bottom:6px">Your primary contact</div>
              <div class="who" id="pc-name"></div>
              <div class="role" id="pc-title"></div>
              <div class="mail" id="pc-mail"></div>
              <div class="actions" id="pc-actions"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <div>
            <h2>Active campaigns</h2>
            <p class="sub" id="camp-sub"></p>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data" id="campaign-table"></table>
        </div>
        <div class="card-foot" id="camp-foot"></div>
      </section>

      <!-- Partnership metrics -->
      <div class="grid-3">
        <a class="card gauge-card" id="gauge-link" href="health.html">
          <div class="card-head">
            <div>
              <h2>Health score</h2>
              <p class="sub">Across every campaign on this account.</p>
            </div>
          </div>
          <div class="card-body">
            <div class="gauge-wrap" id="gauge"></div>
          </div>
        </a>

        <section class="card">
          <div class="card-head">
            <div>
              <h2>Volume</h2>
              <p class="sub">Trailing four weeks.</p>
            </div>
          </div>
          <div class="card-body">
            <div class="tile-label" style="margin-top:2px">Average weekly volume</div>
            <div class="tile-value" id="vol-weekly" style="font-size:34px">—</div>
            <div class="tile-sub" id="vol-sub"></div>
            <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
              <div class="tile-label">Accepted, last 30 days</div>
              <div class="tile-value" id="vol-accepted" style="font-size:24px">—</div>
              <div class="tile-sub" id="vol-accepted-sub"></div>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <div>
              <h2>Billing details</h2>
              <p class="sub" id="billing-sub"></p>
            </div>
          </div>
          <div class="card-body">
            <div class="tile-label" style="margin-top:2px">Next payment</div>
            <div class="tile-value" id="billing-next" style="font-size:24px">—</div>
            <div class="tile-sub" id="billing-terms"></div>
            <div class="tile-sub" id="billing-cadence" style="margin-top:8px;line-height:1.5"></div>
            <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)" id="billing-contacts"></div>
          </div>
        </section>
      </div>

    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/health.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  'use strict';
  var D = FZData, A = FZApp, H = FZHealth;

  var state = A.params();
  var p = state.partner;

  A.shell(state, {
    active: 'partnership.html',
    title: 'Partnership summary',
    subtitle: 'Your account at a glance, and who to talk to.'
  });

  /* ---- hero: name + DERIVED status + since ------------------------------ */
  document.getElementById('hero-name').textContent = p.name;

  /* Active = at least one accepted lead in the trailing month. Derived from
     the lead table, never a stored flag — see ADMIN-MAPPING.md §1. */
  var act = D.isPartnerActive(state.partnerId);
  document.getElementById('hero-status').innerHTML =
    '<span class="badge ' + (act.active ? 'badge-good' : 'badge-warn') + '" style="font-size:13px;padding:4px 12px">' +
    '<span class="dot"></span>' + (act.active ? 'Active' : 'Inactive') + '</span>' +
    '<div class="quota" style="margin-top:8px">Partner since ' + A.esc(D.fmtSince(state.partnerId)) + '</div>' +
    (!act.active && act.lastAcceptedAt
      ? '<div class="quota" style="margin-top:2px">Last accepted lead ' + A.fmtDate(act.lastAcceptedAt) + '</div>'
      : '');

  /* ---- account manager --------------------------------------------------- */
  var am = D.ACCOUNT_MANAGER;
  document.getElementById('am-name').textContent = am.name;
  document.getElementById('am-title').textContent = am.title;
  document.getElementById('am-mail').innerHTML =
    '<a href="mailto:' + A.esc(am.email) + '">' + A.esc(am.email) + '</a>';
  document.getElementById('am-actions').innerHTML =
    '<a class="btn btn-sm" href="mailto:' + A.esc(am.email) + '" target="_blank" rel="noopener">✉ Email</a>' +
    '<a class="btn btn-sm" href="' + A.esc(am.chatUrl) + '" target="_blank" rel="noopener">💬 Google Chat</a>';

  /* ---- primary contact --------------------------------------------------- */
  /* One primary per affiliate, editable by any of that affiliate's users.
     Changing it happens on the Account page, where all users are listed. */
  var pc = D.primaryContact(state.partnerId);
  document.getElementById('pc-name').innerHTML = A.esc(pc.name) +
    (pc.away ? ' <span class="away-chip">Away</span>' : '');
  document.getElementById('pc-title').textContent = pc.title;
  document.getElementById('pc-mail').innerHTML =
    '<a href="mailto:' + A.esc(pc.email) + '">' + A.esc(pc.email) + '</a>';
  document.getElementById('pc-actions').innerHTML =
    '<a class="btn btn-sm" href="' + A.linkTo('account.html', state) + '">Change primary contact</a>';

  /* ---- gauge --------------------------------------------------------------
     A dial, not a fill meter: the arc is a recessive AXIS (grid weight, like
     any chart axis), tick marks every 10 points carry the scale, and a
     tapered needle in the validated severity colour points at the score. The
     number and tier badge sit below the dial rather than floated over it. */
  document.getElementById('gauge-link').href = A.linkTo('health.html', state);
  (function () {
    var hs = H.score({ partnerId: state.partnerId });
    var C = FZCharts;

    var sevSuffix = { '': '', 'is-warning': '-warning', 'is-serious': '-serious', 'is-critical': '-critical' }[H.meterClass(hs.score)];
    var needleColor = C.cssVar('--meter-fill' + sevSuffix);
    var axis = C.cssVar('--axis');
    var muted = C.cssVar('--ink-muted');
    var surface = C.cssVar('--surface-1');

    var W = 224, HGT = 132;
    var cx = W / 2, cy = 116, R = 92;

    /* t: 0..1 across the semicircle, left → right. */
    function pt(t, r) {
      var a = Math.PI * (1 - t);
      return [cx + r * Math.cos(a), cy - r * Math.sin(a)];
    }
    function f(n) { return n.toFixed(1); }

    var svg = '';

    /* Axis arc — hairline-weight, recessive. */
    var a0 = pt(0, R), a1 = pt(1, R);
    svg += '<path d="M' + f(a0[0]) + ',' + f(a0[1]) + ' A' + R + ',' + R + ' 0 1,1 ' +
      f(a1[0]) + ',' + f(a1[1]) + '" fill="none" stroke="' + axis + '" stroke-width="3"/>';

    /* Ticks every 10 points, longer at 0 / 50 / 100. */
    for (var i = 0; i <= 10; i++) {
      var t = i / 10;
      var major = (i === 0 || i === 5 || i === 10);
      var o = pt(t, R - 4), n = pt(t, R - (major ? 16 : 11));
      svg += '<line x1="' + f(o[0]) + '" y1="' + f(o[1]) + '" x2="' + f(n[0]) + '" y2="' + f(n[1]) +
        '" stroke="' + muted + '" stroke-width="' + (major ? 2 : 1.25) + '"/>';
    }

    /* End labels so the scale reads without a legend. */
    svg += '<text x="' + f(cx - R) + '" y="' + (cy + 14) + '" text-anchor="middle" fill="' + muted + '" font-size="11">0</text>' +
           '<text x="' + f(cx + R) + '" y="' + (cy + 14) + '" text-anchor="middle" fill="' + muted + '" font-size="11">100</text>';

    /* Needle — a tapered polygon from the pivot to just short of the ticks,
       with an arrowhead taper at the tip. */
    var tScore = Math.max(0, Math.min(1, hs.score / 100));
    var tip = pt(tScore, R - 22);
    var ang = Math.PI * (1 - tScore);
    var px = Math.sin(ang) * 4, py = Math.cos(ang) * 4;   /* perpendicular, 4px half-width */
    svg += '<polygon points="' +
        f(cx - px) + ',' + f(cy - py) + ' ' +
        f(cx + px) + ',' + f(cy + py) + ' ' +
        f(tip[0]) + ',' + f(tip[1]) + '" ' +
      'fill="' + needleColor + '"/>';

    /* Pivot, ringed in the surface colour like any end-marker. */
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="7" fill="' + needleColor +
      '" stroke="' + surface + '" stroke-width="2"/>';

    document.getElementById('gauge').innerHTML =
      '<svg width="' + W + '" height="' + HGT + '" viewBox="0 0 ' + W + ' ' + HGT + '" role="img" ' +
        'aria-label="Health score ' + hs.score + ' out of 100, tier ' + hs.tier.label + '">' + svg + '</svg>' +
      '<div style="display:flex;align-items:baseline;gap:10px;margin-top:10px">' +
        '<span class="gauge-value">' + hs.score + '</span>' +
        '<span class="badge ' + hs.tier.badge + '"><span class="dot"></span>' + hs.tier.label + '</span>' +
      '</div>' +
      '<div class="gauge-hint">See the full breakdown →</div>';
  })();

  /* ---- volume ------------------------------------------------------------- */
  (function () {
    document.getElementById('vol-weekly').textContent = A.fmtInt(D.avgWeeklyVolume(state.partnerId));
    document.getElementById('vol-sub').textContent = 'leads per week, all campaigns';

    var coh = D.cohort({ partnerId: state.partnerId, rateBasis: state.rateBasis });
    document.getElementById('vol-accepted').textContent = A.fmtInt(coh.metrics.paid);
    document.getElementById('vol-accepted-sub').textContent =
      A.fmtPct(coh.metrics.acceptanceRate, 1) + ' acceptance';
  })();

  /* ---- billing ------------------------------------------------------------ */
  (function () {
    document.getElementById('billing-sub').textContent = 'Terms and who to ask.';

    /* The DATE leads; the net terms demote to a sub-line. Derived: third
       business day after the most recent month close, rolling forward once
       past. */
    var pay = D.nextPaymentDate();
    document.getElementById('billing-next').textContent =
      A.fmtDate(pay.date) + (pay.isToday ? ' — today' : '');
    document.getElementById('billing-terms').textContent =
      p.billingPeriod + ' · ' + p.billingBasis.charAt(0).toLowerCase() + p.billingBasis.slice(1) +
      ' · payment usually lands three business days after the month closes';
    document.getElementById('billing-cadence').innerHTML =
      'We send your lead report immediately after the month closes — ' +
      '<strong>please return your invoice as soon as you receive it</strong> so payment ' +
      'is not held up.';
    document.getElementById('billing-contacts').innerHTML =
      D.BILLING_CONTACTS.map(function (c) {
        return '<div style="margin-bottom:9px">' +
          '<div style="font-size:13.5px;font-weight:600">' + A.esc(c.name) +
          ' <span style="font-weight:400;color:var(--ink-muted)">· ' + A.esc(c.note) + '</span></div>' +
          '<div style="font-size:13px"><a href="mailto:' + A.esc(c.email) + '">' + A.esc(c.email) + '</a></div>' +
        '</div>';
      }).join('');
  })();

  /* ---- active campaigns ---------------------------------------------------
     Comp model shows the MODEL only — Revenue share / Tiered CPL / Flat CPL.
     Rates live behind "View details". */
  (function () {
    var camps = D.activeCampaignsFor(state.partnerId);

    var head = '<thead><tr><th>CID</th><th>Campaign</th><th>Product</th>' +
      '<th>Comp model</th><th>Launched</th><th></th></tr></thead>';

    var body = camps.map(function (c) {
      return '<tr>' +
        '<td class="lead-id">' + A.esc(c.id) + '</td>' +
        '<td><strong>' + A.esc(c.name) + '</strong></td>' +
        '<td>' + A.esc(c.product) + '</td>' +
        '<td>' + A.esc(D.compLabelForCampaign(c)) + '</td>' +
        '<td style="color:var(--ink-2);white-space:nowrap">' + A.esc(c.launched) + '</td>' +
        '<td style="text-align:right">' +
          '<a class="btn btn-sm" href="' +
            A.linkTo('index.html', state, { campaign: c.id, subid: 'all' }) +
          '">View details →</a>' +
        '</td>' +
        '</tr>';
    }).join('');

    document.getElementById('campaign-table').innerHTML = head + '<tbody>' +
      (body || '<tr><td colspan="6" class="empty">No active campaigns on this account.</td></tr>') +
      '</tbody>';

    document.getElementById('camp-sub').textContent =
      camps.length + (camps.length === 1 ? ' campaign' : ' campaigns') + ' live right now.';

    var inactive = D.inactiveCampaignsFor(state.partnerId).length;
    document.getElementById('camp-foot').innerHTML =
      'This account has <strong>' + inactive + '</strong> campaign' + (inactive === 1 ? '' : 's') +
      ' marked as inactive.';
  })();

})();
</script>
</body>
</html>
