<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup &amp; docs — Financialize Partner Portal</title>
<link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

<div class="app">
  <aside class="sidebar" data-shell="sidebar"></aside>

  <div class="main">
    <header class="topbar" data-shell="topbar"></header>

    <div class="content">

      <!-- A hub, not a page of content. Three destinations, then help. The
           campaign flows are placeholders pending Logan's spec. -->
      <section class="card">
        <div class="card-head">
          <div>
            <h2>Campaigns</h2>
            <p class="sub">Launch something new, or change how an existing campaign runs.</p>
          </div>
        </div>
        <div class="card-body">
          <div class="user-grid" id="actions" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))"></div>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <div>
            <h2>Helpful documents</h2>
            <p class="sub">Everything you need to integrate, qualify and get paid.</p>
          </div>
        </div>
        <div class="card-body">
          <div id="doc-featured"></div>
          <div class="user-grid" id="doc-grid"
               style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:14px"></div>
          <div class="mocknote" id="doc-note"></div>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <div>
            <h2>Have questions?</h2>
          </div>
        </div>
        <div class="card-body" id="contact"></div>
      </section>

    </div>
  </div>
</div>

<script src="assets/data/dataset.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/health.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/tables.js"></script>
<script>
(function () {
  'use strict';
  var D = FZData, A = FZApp;

  var state = A.params();
  A.shell(state, {
    active: 'setup.html',
    title: 'Setup & docs',
    subtitle: 'Campaign setup, documentation and who to ask.'
  });

  /* ---- campaign actions --------------------------------------------------
     Both flows are PLACEHOLDERS pending Logan's spec. They open a modal
     saying so rather than a half-built form, because a form that looks real
     and does nothing is worse than an honest stub. */
  (function () {
    var ACTIONS = [
      { key: 'new', title: 'Set up new campaign', ico: '＋',
        desc: 'Launch a new product, geo or traffic source on your account.' },
      { key: 'edit', title: 'Edit existing campaign', ico: '✎',
        desc: 'Change caps, targeting or where your leads post.' }
    ];
    document.getElementById('actions').innerHTML = ACTIONS.map(function (a) {
      return '<button type="button" class="user-card" data-act="' + a.key + '" ' +
        'style="display:block;text-align:left;cursor:pointer;font-family:inherit;width:100%">' +
        '<div style="font-size:22px;line-height:1;margin-bottom:8px;color:var(--brand-coral)">' + a.ico + '</div>' +
        '<div style="font-size:15px;font-weight:600">' + A.esc(a.title) + '</div>' +
        '<div style="font-size:13px;color:var(--ink-2);margin-top:4px">' + A.esc(a.desc) + '</div>' +
        '</button>';
    }).join('');

    document.querySelectorAll('[data-act]').forEach(function (b) {
      b.addEventListener('click', function () {
        var a = ACTIONS.filter(function (x) { return x.key === b.dataset.act; })[0];
        A.openModal({
          title: a.title,
          html: '<div class="notice notice-mock"><span class="ico">✎</span><div>' +
            '<strong>Placeholder.</strong> This flow has not been designed yet. ' +
            'For now, contact Logan Randall to ' +
            (a.key === 'new' ? 'set up a new campaign' : 'change an existing campaign') + '.' +
            '</div></div>' +
            '<p style="color:var(--ink-2);font-size:14px">' +
            '<a href="mailto:logan@financialize.com">logan@financialize.com</a></p>',
          returnFocusTo: b
        });
      });
    });
  })();

  /* ---- documents ----------------------------------------------------------
     Rendered from D.documentsFor(), NOT typed into this page, so the team can
     add or retire a document without touching the portal. `agreement` is
     per-affiliate: the admin pastes that partner's own Google Doc URL onto
     their record. A document with no URL renders as "not linked yet" rather
     than a dead button — see ADMIN-MAPPING §7. */
  (function () {
    var docs = D.documentsFor(state.partnerId);

    function card(d, big) {
      var linked = !!d.url;
      var inner =
        '<div style="font-size:' + (big ? '17' : '15') + 'px;font-weight:600">' + A.esc(d.label) +
          (d.scope === 'partner'
            ? A.tip('This document is specific to your account and is linked by your account manager.')
            : '') + '</div>' +
        '<div style="font-size:13px;color:var(--ink-2);margin-top:4px">' + A.esc(d.desc) + '</div>' +
        (linked ? '' : '<div style="margin-top:8px"><span class="badge badge-warn">' +
          '<span class="dot"></span>Not linked yet</span></div>');

      if (!linked) {
        return '<div class="user-card" style="display:block;opacity:.85' +
          (big ? ';padding:18px' : '') + '">' + inner + '</div>';
      }
      return '<a class="user-card" href="' + A.esc(d.url) + '" target="_blank" rel="noopener" ' +
        'style="display:block;text-decoration:none;color:inherit' +
        (big ? ';padding:18px;border-color:var(--brand-coral)' : '') + '">' + inner +
        '<div style="font-size:13px;color:var(--brand-coral);font-weight:600;margin-top:8px">Open →</div></a>';
    }

    var featured = docs.filter(function (d) { return d.featured; });
    var rest = docs.filter(function (d) { return !d.featured; });

    document.getElementById('doc-featured').innerHTML =
      featured.map(function (d) { return card(d, true); }).join('');
    document.getElementById('doc-grid').innerHTML =
      rest.map(function (d) { return card(d, false); }).join('');

    var unlinked = docs.filter(function (d) { return !d.url; });
    document.getElementById('doc-note').innerHTML =
      '<strong>Build note.</strong> This list is admin-managed — documents are added and ' +
      're-linked without a deploy. <strong>Your agreement</strong> is per-affiliate: the admin ' +
      'pastes that partner\'s own Google Doc URL onto their record.' +
      (unlinked.length
        ? ' Currently unlinked in this mock: ' +
          unlinked.map(function (d) { return A.esc(d.label); }).join(', ') + '.'
        : '');
  })();

  /* ---- contact ------------------------------------------------------------ */
  document.getElementById('contact').innerHTML =
    '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">' +
      '<div style="flex:1;min-width:220px">' +
        '<div style="font-size:15px;font-weight:600">Logan Randall</div>' +
        '<div style="font-size:13px;color:var(--ink-2)">Affiliate Performance Manager</div>' +
      '</div>' +
      '<a class="btn btn-primary" href="mailto:logan@financialize.com">Email Logan</a>' +
    '</div>';

  if (window.FZTable) FZTable.enhanceAll();

})();
</script>
</body>
</html>
